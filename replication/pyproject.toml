[project]
name = "wealth-tax-es-replication"
version = "0.1.0"
description = "Open re-encoding of the eight wealth-tax designs in Cantó & García-Rodríguez (2026), IARIW #195"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wealth_tax_es"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
